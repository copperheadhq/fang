name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,analysis]"
      # Determinism is asserted across processes, so the seed must vary between runs.
      - name: Test
        run: python -m pytest -rs
        env:
          PYTHONHASHSEED: random

  package:
    name: build and verify the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: python -m pip install --upgrade pip build twine && python -m build
      - name: Check metadata
        run: python -m twine check --strict dist/*
      - name: Install the wheel into a clean environment and smoke-test it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/python -c "import fang; print(fang.__version__, fang.SCHEMA_VERSION)"
          /tmp/smoke/bin/fang --help
          /tmp/smoke/bin/fang check examples/divider.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
