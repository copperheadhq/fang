name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev,analysis]"
          python -m pytest -rs
      - name: Refuse a tag that disagrees with fang.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import fang; print(fang.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match fang.__version__ $version" >&2
            exit 1
          fi
      - name: Build
        run: python -m build && python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/copperhead-fang
    # Trusted publishing: no API token is stored, the workflow mints one.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
