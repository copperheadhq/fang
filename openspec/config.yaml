context: |
  Project: Fang - the Copperhead hardware kernel and its Python-embedded
  authoring language.

  Scope of this repository: the Fang language surface, the kernel graph,
  stable identity, units and quantities, typed interfaces, constraints,
  transactions with a commit gate, and deterministic serialization.

  Source standard (in-repo): openspec/specs/fang-kernel/spec.md is the single
  self-contained normative document. It defines the Engineering Intermediate
  Representation (EIR) and the hardware kernel and Fang language over it, and
  carries the terminology, design principles, layers of representation, kernel
  architecture, and project root as front matter before its requirements.
  There is no other standards document in this repository.

  Governing rule: there is exactly one canonical model (the EIR).
  The kernel graph is its live realization; everything else is a lowering,
  a projection, or an interchange encoding. Never introduce a second
  persisted representation of the same facts.

  Tech stack: Python 3.11+, standard library first. NetworkX for graph
  analysis only (never exposed as a public representation). Deterministic
  JSON serialization, decimal (not binary float) magnitudes.

  Conventions: RFC2119 keywords are normative. Every entity carries stable
  identity, provenance, and a source location. Unknown is representable;
  null never means "unknown". Undecided is a third truth value and is never
  silently converted to pass or fail.
